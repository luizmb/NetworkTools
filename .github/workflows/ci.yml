name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Build & Test
    runs-on: macos-26
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Cache Mint packages
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('Mintfile') }}
          restore-keys: ${{ runner.os }}-mint-

      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-homebrew-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: ${{ runner.os }}-homebrew-

      - name: Install Mint
        run: brew install mint

      - name: Install Periphery
        run: brew install peripheryapp/periphery/periphery

      - name: Install SwiftLint, SwiftFormat, Periphery
        run: mint bootstrap

      - name: Format (check)
        run: mint run swiftformat --lint .

      - name: Lint
        run: mint run swiftlint lint --strict

      - name: Build
        run: swift build 2>&1

      - name: Test
        run: swift test 2>&1

      - name: Periphery
        run: periphery scan

  test-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-latest
    # swift-actions/setup-swift has no 6.3 yet — use the official Swift 6.3 container.
    container: swift:6.3
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: swift build 2>&1

      - name: Test
        run: swift test 2>&1

  # Builds against the LATEST versions allowed by Package.swift (not the pinned Package.resolved),
  # so a source-breaking dependency minor (FP / ReactiveConcurrency) fails here — at the source —
  # rather than only surfacing downstream. Dependabot proposes bumps but never compiles them.
  test-latest-deps:
    name: Build & Test (latest dependencies)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.5.app

      - name: Resolve to latest allowed dependency versions
        run: swift package update 2>&1

      - name: Build
        run: swift build 2>&1

      - name: Test
        run: swift test 2>&1

  # The whole package builds on Windows: NetworkServer's swift-nio (NIOPosix) deps are
  # condition-gated out of Windows in Package.swift AND its sources are #if canImport(NIOCore)
  # gated (compile-empty on Windows); Multipeer/BonjourService are #if canImport gated too.
  # So the portable products (Core, HTMLTemplating, NetworkClient, WebSocketClient) compile and
  # the non-portable ones become empty. See the platform-support matrix in README.md.
  test-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.3-release
          swift-build: 6.3-RELEASE
      - uses: actions/checkout@v7
      - name: Build
        run: swift build
